[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-backend"
version = "0.1.0"
description = "Aegis — multi-agent incident response system (MVP: investigation, read-only)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic[email]>=2.6",
    "pydantic-settings>=2.2",
    "pgvector>=0.2.5",
    "structlog>=24.1",
    "redis>=5.0",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    # Firebase ID-token verification (ESD §8). The reference implementation is used rather
    # than hand-rolled JWKS verification because this is a security boundary; its blocking
    # calls are dispatched to a worker thread so the event loop is never held.
    "firebase-admin>=6.5",
    "langgraph>=0.2",
    "langchain-core>=0.2",
    "mcp>=1.2",
    # Local ONNX embedding + reranking (ESD §20). Chosen over sentence-transformers to avoid
    # a ~2.5GB torch dependency for the same BGE model quality.
    "fastembed>=0.8",
]

[project.optional-dependencies]
# LLM-judged evaluation. Deliberately NOT a runtime dependency: ragas pulls ~37 packages
# (pandas, pyarrow, datasets, langchain, openai) and shipping those into the production image
# to support a CI-only measurement is a poor trade. The deterministic retrieval gate in
# `evaluation/retrieval_metrics.py` needs none of this and runs on every commit.
eval = [
    "ragas>=0.4",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "anyio>=4.3",
]

[tool.setuptools]
packages = [
    "agents",
    "evaluation",
    "guardrails",
    "api",
    "core",
    "db",
    "mcp_servers",
    "memory",
    "orchestrator",
    "providers",
    "rag",
    "redaction",
    "safety",
    "worker",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, bugbear, comprehensions, pyupgrade
select = ["E", "F", "I", "B", "C4", "UP"]

[tool.ruff.lint.per-file-ignores]
# B008: `Depends(...)` in argument defaults is FastAPI's dependency-injection idiom.
"api/**" = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    # Loads a real ONNX model from the local cache. Slower than the rest of the unit suite
    # and needs a one-time model download, so it is separable: `-m "not embedding"`.
    "embedding: exercises the real local embedding/reranker model",
    # Calls a real judge model (RAGAS). Costs judge-model tokens and needs GEMINI_API_KEYS,
    # so it is opt-in (`-m ragas_live`) rather than part of the default per-commit run —
    # the deterministic retrieval gate in evaluation/retrieval_metrics.py is what runs on
    # every commit; this is the pre-release check.
    "ragas_live: calls a real LLM judge; on-demand only, never per-commit",
]
