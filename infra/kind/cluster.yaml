# kind cluster for Aegis's local chaos-testing environment (ESD §18).
# A single control-plane node runs Meridian Commerce's simulated services plus
# kube-prometheus-stack. Prometheus is exposed to the host on :9090 via a NodePort so the
# Prometheus MCP server (running on the host in MVP) can query it directly.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: aegis
nodes:
  - role: control-plane
    extraPortMappings:
      # host localhost:9090 -> Prometheus NodePort 30090
      - containerPort: 30090
        hostPort: 9090
        protocol: TCP
      # host localhost:9093 -> Alertmanager NodePort 30093 (alert source for ingestion)
      - containerPort: 30093
        hostPort: 9093
        protocol: TCP
